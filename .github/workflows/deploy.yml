name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  # Manual "Run workflow" button / `gh workflow run` — re-deploy without an empty commit.
  workflow_dispatch:

env:
  PROJECT_ID: marketplace-507219
  SERVICE_NAME: marketplace-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-secrets SECRET_KEY=marketplace-secret-key:latest,DATABASE_URL=marketplace-database-url:latest,ANTHROPIC_API_KEY=marketplace-anthropic-key:latest,VOYAGE_API_KEY=marketplace-voyage-key:latest \
            --set-env-vars ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=30,GCS_BUCKET_NAME=marketplace-507219-product-images,FRONTEND_URL=https://marketplace-frontend-770988956423.us-central1.run.app
